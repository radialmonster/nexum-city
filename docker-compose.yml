# Nexum City. `docker compose up --build` runs it locally; FlyWP reads this file from GitHub.
services:
  app:
    build: .
    image: nexum-city:latest
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATA_DIR: /app/data
      # Set COOKIE_SECURE=true behind HTTPS, and TRUST_PROXY=true behind a reverse proxy.
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      TRUST_PROXY: '${TRUST_PROXY:-false}'
      TICK_MS: '${TICK_MS:-2000}'
      BOTS_ENABLED: '${BOTS_ENABLED:-true}'
      BOT_COUNT: '${BOT_COUNT:-6}'
      BOT_MIN: '${BOT_MIN:-2}'
      SEASON_DAYS: '${SEASON_DAYS:-7}'
      SEASON_BREAK_HOURS: '${SEASON_BREAK_HOURS:-0}'
      TICK_LOG_MINUTES: '${TICK_LOG_MINUTES:-15}'
    volumes:
      - nexum-data:/app/data
    # Logs are JSON lines on stdout; rotate them so they cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  nexum-data:
